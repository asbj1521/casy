name: CI

# Every branch, so a feature branch is checked (screenshots included) before
# it is merged into main, which deploys.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Type-checks (tsc -b) before bundling.
      - run: npm run build
      - run: npm run test:run

  browser:
    name: Browser tests
    # A [screenshots] commit asks for new reference images (screenshots.yml),
    # so it would only fail here against the old ones.
    if: ${{ !contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-latest
    # Playwright's own image: the browsers and the fonts the reference
    # screenshots were made with. Its version must match @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
        env:
          # Firefox and WebKit aren't used, but Playwright wants a writable home.
          HOME: /root
      # What differed: the report with each screenshot's expected, actual and
      # diff images, and the traces of failed tests.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          retention-days: 14

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=none keeps Deno away from the web app's node_modules.
      - run: deno check --node-modules-dir=none */index.ts _shared/*.ts
      - run: deno test --node-modules-dir=none --allow-all _shared/
