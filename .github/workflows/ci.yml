name: CI

# Every branch, so a feature branch is checked (screenshots included) before
# it is merged into main, which deploys.
on:
  # Branches only: a release tag (app-<version>-<build>, #143) marks a commit
  # already checked, so its push starts nothing (#208).
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to a branch cancels that branch's runs still going (#189): they
# check a commit already left behind, and kept the queue full when GitHub
# was slow. Never on main: each of its commits is a group of its own, so a
# deploy's checks are never cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job has a time limit (#208): normally about 2 minutes (web), 4 (each
# browser part) and 1 (functions). Without one, a job GitHub leaves stuck
# runs for 6 hours and blocks the branch's next run behind it.
jobs:
  # Whether the browser tests can be affected (#208): not when every file the
  # branch changed (against main; on main, the push) is in docs/, scripts/,
  # ios/ or supabase/ (none of which the browser tests run), or is a Markdown
  # file. The web job's unit tests still run, and keep the pairs shared with
  # supabase/ equal. Anything else, or a base that can't be found, runs them.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD || true); fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare with; running everything"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "Changed since ${base:0:7}:"; echo "$files"
          if echo "$files" | grep -v -E '^(docs/|scripts/|ios/|supabase/)|\.md$' | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the browser tests run changed; they are skipped"
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unused files, exports and dependencies in src/ and e2e/ (knip.json).
      - run: npm run knip
      - run: npm run format:check
      # Type-checks (tsc -b) before bundling.
      - run: npm run build
      - run: npm run test:run

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    # A [screenshots] commit asks for new reference images (screenshots.yml),
    # so it would only fail here against the old ones. Skipped too when
    # nothing they run changed (the changes job); a skipped job passes.
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' && !contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image: the browsers and the fonts the reference
    # screenshots were made with. Its version must match @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # The suite in four parts side by side (#194): one runner took six minutes
    # with two tests at a time. Every part runs to the end, so a failure in
    # one still shows the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Firefox and WebKit aren't used, but Playwright wants a writable home.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # npm's download cache, so npm ci unpacks rather than downloads.
      - uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      # What differed: the report with each screenshot's expected, actual and
      # diff images, and the traces of failed tests; one per part.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=none keeps Deno away from the web app's node_modules.
      # ../review/ is the App Review demo (#142), built on the functions' own code.
      - run: deno check --node-modules-dir=none */index.ts _shared/*.ts ../review/*.ts
      - run: deno test --node-modules-dir=none --allow-all _shared/ ../review/
