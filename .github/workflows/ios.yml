name: iPhone app

# The app's Swift, built on a Mac (#198): CI's other jobs run on Linux and
# never compile it. Only when something the app is built from changes, so a
# commit to the website alone doesn't wait for a macOS runner.
on:
  push:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
      - "scripts/native/**"
      - "e2e/backend.ts"
      - "e2e/world.ts"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
      - "scripts/native/**"
      - "e2e/backend.ts"
      - "e2e/world.ts"

# As in ci.yml: a new push to a branch cancels its runs still going, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build for the simulator
    # macos-latest: a job asking for macos-26 waited in the queue with no
    # runner. The Xcode is picked below.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor's Swift packages are read from node_modules.
      - run: npm ci
      # The site the app packages (ios/App/App/public, not in git), copied in
      # with cap sync, which also writes CapApp-SPM's Package.swift.
      - run: npm run build
      - run: npx cap sync ios
      # Xcode 26 at the least: Swift tools 6.2 (CapApp-SPM, CasyUI), the iOS 26
      # SDK and the project's Xcode 16 format. The newest 26 or later installed.
      - name: Pick Xcode 26 or later
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 or later on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      # Debug holds screens not yet shipped (#if DEBUG); Release is what people
      # get. No signing: nothing is installed.
      - name: Build (Debug)
        working-directory: ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Build (Release)
        working-directory: ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Release
          -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
      # The native screens, signed in against the fake backend (#198). On main
      # only, after the merge: they take about 9 minutes on GitHub's Mac, and
      # are run on this Mac before every commit. The native screens are Debug
      # only until the rewrite ships, so a failure here never reaches anyone.
      - name: UI tests
        if: github.ref == 'refs/heads/main'
        run: |
          device=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1 \
            | sed -E 's/^ +(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "On $device"
          UI_TEST_DEVICE="$device" scripts/native/ui-tests.sh
