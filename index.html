<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The favicon's mark for "Add to Home Screen", full-bleed: iOS rounds it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page background in each theme, for the browser's own bars (lib/theme.ts). -->
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Casy samler gruppens kalendere og finder det første tidspunkt, hvor alle kan."
    />
    <!-- Safari's own "Get / Open" bar on an iPhone; a web view (the app) ignores it. -->
    <meta name="apple-itunes-app" content="app-id=6830713238" />
    <!-- What a shared link (an invite in Messages, say) shows as its preview. -->
    <meta property="og:site_name" content="Casy" />
    <meta property="og:title" content="Casy" />
    <meta
      property="og:description"
      content="Casy samler gruppens kalendere og finder det første tidspunkt, hvor alle kan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- The logo, small and square; must be a full address for previews to find it. -->
    <meta property="og:image" content="https://casy.app/og-logo.png" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="300" />
    <meta name="twitter:card" content="summary" />
    <title>Casy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
