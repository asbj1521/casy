<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The favicon's mark for "Add to Home Screen", full-bleed: iOS rounds it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page background in each theme, for the browser's own bars (lib/theme.ts). -->
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Vi kigger i jeres kalendere og finder den første dag, hvor alle kan."
    />
    <!-- Safari's own "Get / Open" bar on an iPhone; a web view (the app) ignores it. -->
    <meta name="apple-itunes-app" content="app-id=6830713238" />
    <!-- What a shared link (an invite in Messages, say) shows as its preview. -->
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:title" content="%VITE_APP_NAME%" />
    <meta
      property="og:description"
      content="Vi kigger i jeres kalendere og finder den første dag, hvor alle kan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- The name in the icon's letters, wide (#269); must be a full address for previews to find it. -->
    <meta property="og:image" content="https://casy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%VITE_APP_NAME%" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
